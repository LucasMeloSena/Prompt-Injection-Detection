[project]
name = "prompt-injection-detector"
version = "1.0.0"
description = "Prompt Injection Detector"
requires-python = ">=3.11"
dependencies = [
    "datasets",
    "fastapi",
    "numpy",
    "passlib[argon2]",
    "peft",
    "psycopg2",
    "pydantic[email]",
    "pymupdf",
    "pytest",
    "python-dotenv",
    "python-jose[cryptography]",
    "python-multipart",
    "scikit-learn",
    "sqlalchemy",
    "torch",
    "transformers",
    "uvicorn[standard]",
    "pytest",
    "pytest-cov",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
