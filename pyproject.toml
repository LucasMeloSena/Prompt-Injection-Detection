[project]
name = "prompt-injection-detector"
version = "1.0.0"
description = "Prompt Injection Detector"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pymupdf",
    "pytest",
    "torch",
    "transformers",
    "datasets",
    "accelerate",
    "scikit-learn",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]